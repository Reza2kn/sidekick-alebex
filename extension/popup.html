<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sidekick connection</title>
<style>body{width:360px;margin:0;padding:24px;background:#fff9ed;color:#181a16;font:20px/1.4 system-ui,sans-serif}h1{font-size:28px;margin:0 0 16px}p{margin:12px 0}label{display:block;margin:20px 0 8px}input,button{box-sizing:border-box;width:100%;padding:14px;font:inherit;border:2px solid #181a16;border-radius:8px}button{margin-top:12px;background:#fd7d26;color:#181a16;font-weight:700;cursor:pointer}button.secondary{background:transparent}input:focus-visible,button:focus-visible{outline:4px solid #005bd1;outline-offset:3px}.scope{font-size:16px}#status{font-weight:700;min-height:56px}</style>
</head><body><h1>Connect Sidekick</h1><p id="status" role="status" aria-live="polite">Checking connection…</p><p class="scope">Access is limited to your Tim Hortons pages and the local Sidekick bridge. No cookies, passwords, card details, or other browser sites are exported.</p><form id="pair-form"><label for="pair-code">Local pairing code</label><input id="pair-code" type="password" autocomplete="off" spellcheck="false" required><button id="connect" type="submit">Connect this profile</button></form><button id="disconnect" class="secondary" type="button">Disconnect</button><script src="popup.js"></script></body></html>
